name: Dependency lockfile remediation candidate (review only)

# Temporary, read-only helper that produces an npm lockfile candidate as
# a PR artifact. It neither writes repository files nor deploys anything.
on:
  pull_request:
    paths:
      - ".github/workflows/dependency-remediation-candidate.yml"
      - "web/package.json"
      - "web/package-lock.json"

permissions:
  contents: read

jobs:
  candidate:
    name: Generate audited dependency-lock candidate (no commit)
    if: github.head_ref == 'fix/atlas-dependency-audit-oct2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js required by the application
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install minimal patched direct versions
        run: npm install --save-exact zod@4.6.7 vite@8.3.5
      - name: Resolve remaining vulnerable transitive dependencies without force
        run: npm audit fix
      - name: Verify no high severity audited packages remain
        run: npm audit --audit-level=high
      - name: Verify clean install reproduces the candidate
        run: npm ci
      - name: Verify licensed frontend build and unit tests
        run: |
          npm run typecheck
          npm run build
          npm run test
      - name: Export audited manifest and lockfile for Git object review
        run: |
          echo ATLAS_PACKAGE_JSON_BEGIN
          base64 -w0 package.json | fold -w 4000
          echo ATLAS_PACKAGE_JSON_END
          echo ATLAS_PACKAGE_LOCK_BEGIN
          base64 -w0 package-lock.json | fold -w 4000
          echo ATLAS_PACKAGE_LOCK_END
      - name: Upload package and lockfile candidate for human review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-audited-npm-lock-candidate
          path: |
            web/package.json
            web/package-lock.json
          if-no-files-found: error
          retention-days: 7

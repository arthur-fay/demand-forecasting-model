name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and verify legacy-v0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: a test compares every registered file with the original commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned uv
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements.txt

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Deployment test tools (M6)
        # The M6 tests run the rendered files through the real nginx, systemd-analyze,
        # shellcheck and openssl; ATLAS_REQUIRE_DEPLOY_TOOLS makes a missing tool a failure.
        run: |
          missing=""
          for tool in nginx shellcheck; do
            command -v "$tool" >/dev/null || PATH="/usr/sbin:$PATH" command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends $missing
            sudo systemctl stop nginx 2>/dev/null || true
          fi
          echo "/usr/sbin" >> "$GITHUB_PATH"

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest with coverage gate
        env:
          ATLAS_REQUIRE_DEPLOY_TOOLS: "1"
        run: uv run pytest

      - name: Deployment scripts pass shellcheck (M6)
        run: shellcheck --severity=style deploy/scripts/*.sh

      - name: Verify, validate and reproduce the legacy-v0 snapshot
        run: uv run atlas check

      - name: Reconciliation residual and data-quality flags (M1)
        run: uv run atlas quality

      - name: Legacy model refit reproduces the published holdout and forecast (M2)
        run: uv run atlas backtest legacy

      - name: Smoke backtest and byte-identical verification (M2)
        run: |
          uv run atlas backtest run --config configs/backtest/smoke.json --output-dir "$RUNNER_TEMP/m2-smoke"
          uv run atlas backtest verify "$RUNNER_TEMP/m2-smoke"

      - name: Smoke uncertainty run and byte-identical verification (M3)
        run: |
          uv run atlas uncertainty run --config configs/uncertainty/smoke.json --output-dir "$RUNNER_TEMP/m3-smoke"
          uv run atlas uncertainty verify "$RUNNER_TEMP/m3-smoke"

      - name: Smoke decision simulation and byte-identical verification (M4)
        run: |
          uv run atlas optimize run --config configs/optimization/smoke.json --output-dir "$RUNNER_TEMP/m4-smoke"
          uv run atlas optimize verify "$RUNNER_TEMP/m4-smoke"
          uv run atlas optimize inspect "$RUNNER_TEMP/m4-smoke"

      - name: Committed M4 reference run reproduces byte for byte on this runner
        run: |
          uv run atlas optimize verify docs/results/atlas-m4-optimization-v1
          uv run atlas optimize inspect docs/results/atlas-m4-optimization-v1

      - name: API contract is current and the API serves the reference data (M5)
        run: |
          uv run atlas api openapi | diff - docs/api/openapi.json
          uv run atlas api serve --port 8765 &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/health/ready > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health/ready
          curl -sf http://127.0.0.1:8765/api/v1/scenarios > /dev/null
          curl -sf -X POST http://127.0.0.1:8765/api/v1/simulations \
            -H 'content-type: application/json' -d '{"horizon_days": 7}' > /dev/null
          kill -INT "$server"
          wait "$server"  # Ctrl+C is a clean shutdown: exit status 0

  deploy-e2e:
    name: Deployment end to end in a disposable systemd container (M6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The test pushes HEAD into a local bare repository the container builds from.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned uv
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-requirements.txt

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Bootstrap, build, activate, fail, roll back, recover and reboot (tests/test_m6_container.py)
        env:
          ATLAS_E2E_CONTAINER: "1"
        run: uv run pytest tests/test_m6_container.py --no-cov -v -s

  dashboard:
    name: Dashboard checks, reproducible build and end to end in a browser (M7)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js (build and test tooling only; releases need no Node.js)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The lock's tools need 22.22.2 or later (jsdom 30, undici 8).
          node-version: "22.22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install hash-pinned uv and the locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r ../.github/ci-requirements.txt
          uv sync --locked

      - name: Install the locked npm dependencies (package-lock.json, integrity-checked)
        run: npm ci

      - name: No known high-severity vulnerability in the locked dependencies
        run: npm audit --audit-level=high

      - name: Prettier, ESLint (type-aware, jsx-a11y) and strict TypeScript
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: The client types equal the committed API contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/openapi.gen.ts

      - name: Unit and component tests with the coverage gate
        run: npm run test:coverage

      - name: The committed build is reproducible from the sources and the lock
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)"

      - name: The build matches its manifest, within the size budgets
        run: |
          npm run verify:dist
          npm run size

      - name: nginx and openssl for the end-to-end stacks
        run: |
          missing=""
          for tool in nginx openssl; do
            command -v "$tool" >/dev/null || PATH="/usr/sbin:$PATH" command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends $missing
            sudo systemctl stop nginx 2>/dev/null || true
          fi
          echo "/usr/sbin" >> "$GITHUB_PATH"

      - name: Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End to end in a browser (the API, a phone, nginx private and public demo)
        run: npx playwright test

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

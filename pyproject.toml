[project]
name = "atlas"
version = "0.7.0"
description = "ATLAS: a research demonstration of reproducible NYC 311 daily demand forecasting, uncertainty assessment (its prediction intervals failed calibration) and a HYPOTHETICAL decision simulation, with an HTTP API, a web dashboard and a deployment package."
readme = "docs/DEVELOPMENT.md"
requires-python = ">=3.12"
authors = [{ name = "Arthur Fay" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=3.0,<3.1",
    "pydantic>=2.9,<3",
    "scipy>=1.18.1,<1.19",
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.54,<0.55",
    "h11>=0.16,<0.17",
]

[project.scripts]
atlas = "atlas.cli:main"
atlas-deploy = "atlas.deploy.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<2.14",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pandas-stubs>=3.0,<3.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.18.1.1,<1.19",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# optype is a typing-only dependency of scipy-stubs; 0.19.0 was released less than two weeks
# before M4 was resolved, so the lock keeps the previous release (dependency cooldown).
# M5 applies the same two-week cooldown: starlette 1.8.0 (a FastAPI dependency) and
# truststore 0.10.5 (an httpx2 dependency, tests only) were released less than two weeks
# before M5 was resolved, so the lock keeps starlette 1.7.0 and truststore 0.10.4.
constraint-dependencies = ["optype<0.19", "starlette<1.8", "truststore<0.10.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Legacy research artifacts are preserved as-is and are not linted.
extend-exclude = ["01 Data", "02 Notebooks", "03 SQL", "04 Power BI", "05 Screenshots", "06 Exports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how pytest checks; S311: seeded shuffles in tests are not cryptographic.
"tests/**" = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/atlas"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=atlas",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "integration: exercises the committed legacy-v0 snapshot end to end",
    "container: M6 end to end in a disposable systemd container (opt-in: ATLAS_E2E_CONTAINER=1)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["atlas"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]
